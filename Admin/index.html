<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- Title & Brand Information -->
    <title>Aayushi Exports Admin — E-Commerce Management Portal</title>
    <meta name="description" content="Aayushi Exports Admin Portal — Comprehensive management dashboard for products, inventory, orders, website content, and analytics." />
    <meta name="keywords" content="Aayushi Exports, Admin Dashboard, E-Commerce, Handicrafts, Brassware, Inventory Management, Order Tracking" />
    <meta name="author" content="Aayushi Exports" />

    <!-- Security & Crawling (Admin portals should not be indexed by search engines) -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Mobile & Browser Appearance -->
    <meta name="theme-color" content="#13172B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Aayushi Admin" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/images/favicon.png" />

    <!-- Open Graph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aayushi Exports Admin — E-Commerce Management Portal" />
    <meta property="og:description" content="Centralized administration portal for managing orders, catalog items, customers, and site settings." />
    <meta property="og:image" content="/assets/images/favicon.png" />

    <!-- Google Fonts (Plus Jakarta Sans, Outfit, DM Sans, Aoboshi One) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Aoboshi+One&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>
      <div style="padding: 28px; text-align: center; font-family: 'Plus Jakarta Sans', sans-serif; color: #13172B; background: #FFF1F3; border-bottom: 2px solid #CC0D39;">
        <h2 style="margin-bottom: 8px; color: #CC0D39;">JavaScript Required</h2>
        <p style="margin: 0; font-size: 14px;">Please enable JavaScript in your browser to access the Aayushi Exports Admin Portal.</p>
      </div>
    </noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
